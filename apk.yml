name: APK derle

# GitHub'da Actions sekmesinden "Run workflow" ile elle calistirilir.
on:
  workflow_dispatch:

jobs:
  derle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Bagimliliklari kur
        run: npm install

      - name: Node projesi bagimliliklari (mineflayer)
        run: npm run node:kur

      - name: Kodu karistir ve arayuzu derle
        run: OBF_ZORUNLU=1 npm run hazirla

      - name: Android projesini olustur ve eklentileri koy
        run: npm run android:ekle

      - name: Senkronla
        run: npx cap sync android

      - name: APK derle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: afk-bot-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
